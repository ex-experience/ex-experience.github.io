<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Admin | EX Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        :root { --bg: #020202; --text: #fff; --green: #0f0; --steel: #8b939c; }
        body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { border: 1px solid #333; padding: 40px; background: #050607; width: 400px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.05); }
        h2 { color: var(--steel); letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 30px; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; background: #111; border: 1px solid #333; color: var(--green); text-align: center; font-family: inherit; font-size: 1.1rem;}
        input:focus { outline: none; border-color: var(--steel); }
        button { width: 100%; padding: 15px; background: var(--text); color: var(--bg); border: none; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; margin-bottom: 15px; text-transform: uppercase;}
        button:hover { background: var(--steel); color: #fff; }
        .btn-green { background: var(--green); color: #000; }
        .btn-green:hover { background: #0c0; }
        #dashboard { display: none; }
        .status { font-size: 0.8rem; color: var(--steel); margin-top: 15px; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCmuzwRyRSr7ILB2P74_dVKCKR4gFzKEeY",
            authDomain: "ex-experience-962ca.firebaseapp.com",
            projectId: "ex-experience-962ca",
            storageBucket: "ex-experience-962ca.firebasestorage.app",
            messagingSenderId: "560048472801",
            appId: "1:560048472801:web:1c8d71c863fc23b41ceda0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>
</head>
<body>

    <div class="container" id="loginBox">
        <h2>[ ACCESS MATRIX ]</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Token">
        <button onclick="checkPass()">DECRYPT</button>
        <div class="status" id="loginStatus"></div>
    </div>

    <div class="container" id="dashboard">
        <h2>[ COMMAND CENTER ]</h2>
        <button onclick="exportData('Users')" class="btn-green">⬇ سحب قاعدة العملاء (Users)</button>
        <button onclick="exportData('Consultations')" class="btn-green">⬇ سحب الاستشارات (Consultations)</button>
        <button onclick="exportData('OracleLogs')">⬇ سحب سجلات أوراكل (Oracle Logs)</button>
        <div class="status" id="dashStatus">System Ready.</div>
    </div>

    <script>
        // 🔒 الرمز السري للدخول إلى هذه اللوحة
        const ADMIN_TOKEN = "HX5_COMMAND_2026"; 

        function checkPass() {
            const pass = document.getElementById('adminPass').value;
            if(pass === ADMIN_TOKEN) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                document.getElementById('loginStatus').innerText = "ACCESS DENIED.";
                document.getElementById('loginStatus').style.color = "red";
            }
        }

        async function exportData(collectionName) {
            const status = document.getElementById('dashStatus');
            status.innerText = `[ DOWNLOADING ${collectionName.toUpperCase()}... ]`;
            status.style.color = "var(--green)";

            try {
                const snapshot = await db.collection(collectionName).get();
                if(snapshot.empty) {
                    status.innerText = "[ NO RECORDS FOUND ]"; status.style.color = "red"; return;
                }

                let csvContent = "\uFEFF"; // لدعم اللغة العربية في إكسيل
                let rows = [];
                let headers = [];

                // استخراج العناوين (رؤوس الأقلام) من أول ملف
                snapshot.forEach(doc => {
                    const data = doc.data();
                    Object.keys(data).forEach(key => {
                        if(!headers.includes(key)) headers.push(key);
                    });
                });
                rows.push(headers.join(","));

                // استخراج البيانات
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let row = [];
                    headers.forEach(header => {
                        let val = data[header] || "";
                        // معالجة التاريخ ليكون مقروءاً
                        if(val && val.seconds) {
                            val = new Date(val.toDate()).toLocaleString('en-GB');
                        }
                        // تنظيف النص من الفواصل والأسطر الجديدة لكي لا يفسد ملف الإكسيل
                        val = val.toString().replace(/"/g, '""');
                        if(val.search(/("|,|\n)/g) >= 0) val = `"${val}"`;
                        row.push(val);
                    });
                    rows.push(row.join(","));
                });

                csvContent += rows.join("\n");

                // تحميل الملف
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `EX_${collectionName}_Archive.csv`;
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                status.innerText = "[ DOWNLOAD COMPLETE ]";
            } catch(err) {
                console.error(err);
                status.innerText = "[ ERROR: CHECK FIREBASE RULES ]";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
