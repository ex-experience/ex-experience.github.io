<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FILE: TRACK 35 // DECRYPTED</title>
    <style>
        :root {
            --cyan: #00f3ff;
            --red: #ff003c;
            --bg: #000;
        }

        body, html {
            margin: 0; padding: 0; background: var(--bg);
            font-family: 'Courier New', Courier, monospace;
            color: #fff; overflow-x: hidden; height: 100vh;
        }

        /* طبقة الفيديو بخاصية التكيف التام */
        #story-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
            filter: brightness(0.4) contrast(1.3);
        }

        /* الغبار السينمائي */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_grain.jpg');
            opacity: 0.06; pointer-events: none; z-index: 2;
        }

        /* حاوية السرد - مصممة للتكيف مع الجوال والشاشات العملاقة */
        #narrative-container {
            position: relative; z-index: 10;
            min-height: 100vh; display: flex; flex-direction: column;
            justify-content: center; padding: 5vw 10vw;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 100%);
            box-sizing: border-box;
        }

        .file-header {
            font-size: clamp(1rem, 2vw, 1.5rem);
            letter-spacing: 5px; color: var(--red);
            margin-bottom: 40px; opacity: 0;
            animation: fadeIn 2s forwards 1s;
        }

        /* النصوص السينمائية المتكيفة (تتغير أحجامها حسب الشاشة) */
        .story-text {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: bold; line-height: 1.6;
            letter-spacing: 2px; max-width: 900px;
            text-shadow: 0 5px 20px rgba(0,0,0,1);
            margin-bottom: 30px;
        }

        /* تنسيقات الكلمات المفتاحية */
        .highlight-cyan { color: var(--cyan); text-shadow: 0 0 15px rgba(0, 243, 255, 0.4); }
        .highlight-red { color: var(--red); text-shadow: 0 0 15px rgba(255, 0, 60, 0.4); }
        
        /* مؤشر الكتابة */
        .cursor {
            display: inline-block; width: 10px; height: clamp(1.2rem, 3vw, 2.5rem);
            background-color: var(--cyan); vertical-align: middle;
            animation: blink 1s infinite; margin-left: 5px;
        }

        @keyframes fadeIn { to { opacity: 1; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* تعديلات خاصة بشاشات الجوال العمودية */
        @media (max-width: 768px) {
            #narrative-container { padding: 10vw 5vw; background: rgba(0,0,0,0.7); }
            .story-text { line-height: 1.8; letter-spacing: 1px; }
        }
    </style>
</head>
<body>

    <video id="story-bg" autoplay muted loop playsinline>
        <source src="ex1.mp4" type="video/mp4">
    </video>
    
    <div class="noise"></div>

    <div id="narrative-container">
        <div class="file-header">>> DECRYPTING FILE: TRACK 35</div>
        <div id="text-output" class="story-text"></div>
        <div class="cursor" id="cursor" style="display: none;"></div>
    </div>

    <script>
        // مصفوفة السرد السينمائي - يمكنك تعديلها أو إضافة سطور جديدة
        const storyLines = [
            "Speed is not just velocity. It is the silence between thoughts.",
            "<br><br>",
            "The project promises to deliver a first-of-its-kind <span class='highlight-cyan'>\"cinematic visual epic\"</span> to dominate global platforms...",
            "<br><br>",
            "Affirming that <span class='highlight-red'>Vision 2030</span> is not just a race, but the birth of a new generation and a national industry that rivals <span class='highlight-cyan'>Hollywood</span> in presentation, the <span class='highlight-cyan'>Nürburgring</span> in performance, and <span class='highlight-cyan'>Japan</span> in technology.",
            "<br><br>",
            "Let's break expectations together... Join the world's elite in shaping the future.",
            "<br><br>",
            "<span class='highlight-red'>This is real フサム | experience™️</span>"
        ];

        const textOutput = document.getElementById('text-output');
        const cursor = document.getElementById('cursor');
        
        let lineIndex = 0;
        let charIndex = 0;
        let isTag = false;
        let currentHTML = "";

        // محرك الطباعة الذكي (يتعرف على أكواد HTML لضمان تلوين الكلمات)
        function typeWriter() {
            if (lineIndex < storyLines.length) {
                cursor.style.display = "inline-block";
                let currentLine = storyLines[lineIndex];

                // إذا كان السطر عبارة عن مسافة (Break)
                if (currentLine === "<br><br>") {
                    currentHTML += currentLine;
                    textOutput.innerHTML = currentHTML;
                    lineIndex++;
                    setTimeout(typeWriter, 500); // وقفة درامية بين الفقرات
                    return;
                }

                // كتابة الحروف
                if (charIndex < currentLine.length) {
                    let char = currentLine.charAt(charIndex);
                    
                    // حماية أكواد الـ HTML لكي لا تطبع كحروف
                    if (char === '<') isTag = true;
                    if (char === '>') isTag = false;

                    currentHTML += char;
                    textOutput.innerHTML = currentHTML;
                    charIndex++;

                    // سرعة الكتابة (أسرع للأكواد، طبيعية للحروف)
                    let speed = isTag ? 0 : 30; 
                    setTimeout(typeWriter, speed);
                } else {
                    // الانتقال للسطر التالي
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeWriter, 800); // وقفة بعد كل جملة
                }
            } else {
                // انتهاء السرد
                cursor.classList.add('blinking');
            }
        }

        // بدء السرد بعد ثانيتين من فتح الملف
        setTimeout(typeWriter, 2000);
    </script>
</body>
</html>
