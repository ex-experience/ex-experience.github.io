<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Vault | EX Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        :root { --bg: #020202; --text: #fff; --green: #0f0; --steel: #8b939c; --google-blue: #4285F4; }
        body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { border: 1px solid #333; padding: 40px; background: #050607; width: 400px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.05); }
        h2 { color: var(--steel); letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 30px; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; background: #111; border: 1px solid #333; color: var(--green); text-align: center; font-family: inherit; font-size: 1.1rem; outline:none;}
        input:focus { border-color: var(--steel); }
        button { width: 100%; padding: 15px; background: var(--text); color: var(--bg); border: none; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; margin-bottom: 15px; text-transform: uppercase;}
        button:hover { background: var(--steel); color: #fff; }
        .btn-green { background: var(--green); color: #000; }
        .btn-green:hover { background: #0c0; }
        
        /* 🟢 Google Admin Button Style */
        .google-admin-btn { width: 100%; padding: 15px; background: transparent; color: var(--text); border: 1px solid var(--google-blue); font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; margin-bottom: 20px; }
        .google-admin-btn:hover { background: rgba(66, 133, 244, 0.1); }
        .google-icon { width: 20px; height: 20px; }

        #dashboard { display: none; }
        .status { font-size: 0.8rem; color: var(--steel); margin-top: 15px; }
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #444; font-size: 0.8rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #222; }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCmuzwRyRSr7ILB2P74_dVKCKR4gFzKEeY",
            authDomain: "ex-experience-962ca.firebaseapp.com",
            projectId: "ex-experience-962ca",
            storageBucket: "ex-experience-962ca.firebasestorage.app",
            messagingSenderId: "560048472801",
            appId: "1:560048472801:web:1c8d71c863fc23b41ceda0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
    </script>
</head>
<body>

    <div class="container" id="loginBox">
        <h2>[ MATRIX VAULT ]</h2>
        
        <!-- 🟢 خيار الدخول عبر Google للأدمن -->
        <button onclick="adminSignInWithGoogle()" class="google-admin-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="google-icon">
            DECRYPT WITH GOOGLE
        </button>

        <div class="divider">OR USE TOKEN</div>

        <input type="password" id="adminPass" placeholder="Enter Admin Token">
        <button onclick="checkPass()">DECRYPT</button>
        <div class="status" id="loginStatus">Authorized Personnel Only.</div>
    </div>

    <div class="container" id="dashboard">
        <h2>[ COMMAND CENTER ]</h2>
        <div id="adminInfo" style="font-size: 0.7rem; color: var(--green); margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px;"></div>
        <button onclick="exportData('Users')" class="btn-green">⬇ سحب قاعدة العملاء (Excel)</button>
        <button onclick="exportData('Consultations')" class="btn-green">⬇ سحب الاستشارات (Excel)</button>
        <button onclick="exportData('OracleLogs')">⬇ سحب سجلات أوراكل</button>
        <div class="status" id="dashStatus">System Ready.</div>
    </div>

    <script>
        // 🔒 الرمز السري التقليدي
        const ADMIN_TOKEN = "HX5_COMMAND"; 
        // 🔒 الإيميل المسموح له بالدخول كآدمن عبر جوجل
        const AUTHORIZED_ADMIN = "hussambinhassan@hotmail.com";

        // 🟢 تسجيل الدخول عبر Google للأدمن
        async function adminSignInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                if (user.email === AUTHORIZED_ADMIN) {
                    showDashboard(`ADMIN IDENTIFIED: ${user.displayName}`);
                } else {
                    await auth.signOut();
                    document.getElementById('loginStatus').innerText = "ACCESS DENIED: EMAIL NOT AUTHORIZED.";
                    document.getElementById('loginStatus').style.color = "red";
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loginStatus').innerText = "CONNECTION BREACH.";
            }
        }

        function checkPass() {
            const pass = document.getElementById('adminPass').value;
            if(pass === ADMIN_TOKEN) {
                showDashboard("TOKEN VALIDATED: ACCESS GRANTED");
            } else {
                document.getElementById('loginStatus').innerText = "ACCESS DENIED.";
                document.getElementById('loginStatus').style.color = "red";
            }
        }

        function showDashboard(msg) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminInfo').innerText = msg;
        }

        async function exportData(collectionName) {
            const status = document.getElementById('dashStatus');
            status.innerText = `[ DOWNLOADING ${collectionName.toUpperCase()}... ]`;
            status.style.color = "var(--green)";

            try {
                const snapshot = await db.collection(collectionName).get();
                if(snapshot.empty) {
                    status.innerText = "[ NO RECORDS FOUND ]"; status.style.color = "red"; return;
                }

                let csvContent = "\uFEFF"; // لدعم اللغة العربية في إكسيل
                let rows = [];
                let headers = [];

                snapshot.forEach(doc => {
                    const data = doc.data();
                    Object.keys(data).forEach(key => { if(!headers.includes(key)) headers.push(key); });
                });
                rows.push(headers.join(","));

                snapshot.forEach(doc => {
                    const data = doc.data();
                    let row = [];
                    headers.forEach(header => {
                        let val = data[header] || "";
                        if(val && val.seconds) val = new Date(val.toDate()).toLocaleString('en-GB'); // تحويل الوقت
                        val = val.toString().replace(/"/g, '""'); // تنظيف النص
                        if(val.search(/("|,|\n)/g) >= 0) val = `"${val}"`;
                        row.push(val);
                    });
                    rows.push(row.join(","));
                });

                csvContent += rows.join("\n");

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `EX_${collectionName}_Archive.csv`;
                link.style.display = "none";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                status.innerText = "[ DOWNLOAD COMPLETE ]";
            } catch(err) {
                console.error(err);
                status.innerText = "[ ERROR: CHECK FIREBASE RULES ]";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
