<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Vault | EX Matrix</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        :root { 
            --bg: #020202; 
            --text: #fff; 
            --green: #0f0; 
            --steel: #8b939c; 
            --google-blue: #4285F4;
            --apple-black: #000;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { border: 1px solid #333; padding: 40px; background: #050607; width: 100%; max-width: 450px; text-align: center; box-shadow: 0 0 20px rgba(0,255,0,0.05); }
        h2 { color: var(--steel); letter-spacing: 2px; text-transform: uppercase; font-size: 1.1rem; margin-bottom: 30px; }
        
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #111; border: 1px solid #333; color: var(--green); text-align: center; font-family: inherit; font-size: 1rem; outline:none; box-sizing: border-box;}
        input:focus { border-color: var(--steel); }
        
        button { width: 100%; padding: 14px; background: var(--text); color: var(--bg); border: none; cursor: pointer; font-weight: bold; font-family: inherit; transition: 0.3s; margin-bottom: 12px; text-transform: uppercase; font-size: 0.85rem;}
        button:hover { background: var(--steel); color: #fff; }
        
        /* 🟢 Admin Buttons Styles */
        .btn-green { background: var(--green); color: #000; }
        .btn-green:hover { background: #0c0; }
        
        .google-admin-btn { background: transparent; color: var(--text); border: 1px solid var(--google-blue); display: flex; align-items: center; justify-content: center; gap: 10px; }
        .google-admin-btn:hover { background: rgba(66, 133, 244, 0.1); }
        
        .apple-admin-btn { background: var(--apple-black); color: var(--text); border: 1px solid #555; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .apple-admin-btn:hover { background: #222; }

        .phone-admin-btn { background: transparent; color: var(--green); border: 1px solid var(--green); }
        .phone-admin-btn:hover { background: rgba(0, 255, 0, 0.05); }

        #dashboard { display: none; }
        #phoneAuthField { display: none; }
        .status { font-size: 0.75rem; color: var(--steel); margin-top: 15px; line-height: 1.5; }
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #444; font-size: 0.7rem; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #222; }
        .divider:not(:empty)::before { margin-left: .5em; }
        .divider:not(:empty)::after { margin-right: .5em; }
        .icon { width: 18px; height: 18px; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCmuzwRyRSr7ILB2P74_dVKCKR4gFzKEeY",
            authDomain: "ex-experience-962ca.firebaseapp.com",
            projectId: "ex-experience-962ca",
            storageBucket: "ex-experience-962ca.firebasestorage.app",
            messagingSenderId: "560048472801",
            appId: "1:560048472801:web:1c8d71c863fc23b41ceda0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
    </script>
</head>
<body>

    <div class="container" id="loginBox">
        <h2>[ COMMAND VAULT ACCESS ]</h2>
        
        <!-- Google Admin -->
        <button onclick="adminSignInWithGoogle()" class="google-admin-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="icon">
            GOOGLE DECRYPT
        </button>

        <!-- Apple Admin -->
        <button onclick="adminSignInWithApple()" class="apple-admin-btn">
            <svg class="icon" viewBox="0 0 384 512" fill="white"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
            APPLE DECRYPT
        </button>

        <div class="divider">OR SECURE CHANNELS</div>

        <!-- Phone Admin Toggle -->
        <div id="phoneAuthField">
            <input type="tel" id="phoneNumber" placeholder="+966XXXXXXXXX">
            <button onclick="sendOTP()" class="phone-admin-btn">SEND CODE</button>
            <input type="text" id="otpCode" placeholder="Enter OTP" style="display:none;">
            <button id="verifyBtn" onclick="verifyOTP()" class="btn-green" style="display:none;">VERIFY & ENTER</button>
        </div>
        <button id="phoneToggle" onclick="showPhoneField()" class="phone-admin-btn">PHONE AUTHENTICATION</button>

        <div class="divider">STRICT TOKEN</div>

        <input type="password" id="adminPass" placeholder="Enter Command Token">
        <button onclick="checkPass()">DECRYPT TOKEN</button>
        
        <div id="recaptcha-container"></div>
        <div class="status" id="loginStatus">High-Level Security Protocol Active.</div>
    </div>

    <div class="container" id="dashboard">
        <h2>[ COMMAND CENTER ]</h2>
        <div id="adminInfo" style="font-size: 0.7rem; color: var(--green); margin-bottom: 20px; border-bottom: 1px solid #222; padding-bottom: 10px;"></div>
        <button onclick="exportData('Users')" class="btn-green">⬇ سحب قاعدة العملاء (Excel)</button>
        <button onclick="exportData('Consultations')" class="btn-green">⬇ سحب الاستشارات (Excel)</button>
        <button onclick="exportData('OracleLogs')">⬇ سحب سجلات أوراكل</button>
        <button onclick="location.reload()" style="background:transparent; color:#555; border:1px solid #222; margin-top:20px;">LOGOUT</button>
        <div class="status" id="dashStatus">Matrix Connection Stable.</div>
    </div>

    <script>
        const ADMIN_TOKEN = "HX5_COMMAND"; 
        const AUTHORIZED_ADMIN = "hussambinhassan@hotmail.com";

        function showDashboard(msg) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('adminInfo').innerText = msg;
        }

        // --- Google Login ---
        async function adminSignInWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                if (result.user.email === AUTHORIZED_ADMIN) {
                    showDashboard(`ADMIN IDENTIFIED: ${result.user.displayName}`);
                } else {
                    await auth.signOut();
                    document.getElementById('loginStatus').innerText = "ACCESS DENIED: UNAUTHORIZED EMAIL.";
                    document.getElementById('loginStatus').style.color = "red";
                }
            } catch (error) { document.getElementById('loginStatus').innerText = "BREACH ATTEMPT OR CONNECTION ERROR."; }
        }

        // --- Apple Login ---
        async function adminSignInWithApple() {
            const provider = new firebase.auth.OAuthProvider('apple.com');
            try {
                const result = await auth.signInWithPopup(provider);
                if (result.user.email === AUTHORIZED_ADMIN) {
                    showDashboard(`ADMIN IDENTIFIED (APPLE): ${result.user.displayName || 'Architect'}`);
                } else {
                    await auth.signOut();
                    document.getElementById('loginStatus').innerText = "ACCESS DENIED: APPLE ID NOT AUTHORIZED.";
                }
            } catch (error) { document.getElementById('loginStatus').innerText = "APPLE INTERFACE ERROR."; }
        }

        // --- Phone Login Logic ---
        function showPhoneField() {
            document.getElementById('phoneToggle').style.display = 'none';
            document.getElementById('phoneAuthField').style.display = 'block';
            window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
        }

        async function sendOTP() {
            const num = document.getElementById('phoneNumber').value;
            try {
                window.confirmationResult = await auth.signInWithPhoneNumber(num, window.recaptchaVerifier);
                document.getElementById('otpCode').style.display = 'block';
                document.getElementById('verifyBtn').style.display = 'block';
                document.getElementById('loginStatus').innerText = "OTP SENT TO REGISTERED DEVICE.";
            } catch (error) { document.getElementById('loginStatus').innerText = "INVALID PHONE OR SERVICE ERROR."; }
        }

        async function verifyOTP() {
            const code = document.getElementById('otpCode').value;
            try {
                const result = await window.confirmationResult.confirm(code);
                showDashboard(`ADMIN IDENTIFIED VIA PHONE: ${result.user.phoneNumber}`);
            } catch (error) { document.getElementById('loginStatus').innerText = "INVALID OTP CODE."; }
        }

        // --- Token Login ---
        function checkPass() {
            const pass = document.getElementById('adminPass').value;
            if(pass === ADMIN_TOKEN) showDashboard("TOKEN VALIDATED: ACCESS GRANTED");
            else { document.getElementById('loginStatus').innerText = "INVALID TOKEN."; document.getElementById('loginStatus').style.color = "red"; }
        }

        // --- Export Logic ---
        async function exportData(collectionName) {
            const status = document.getElementById('dashStatus');
            status.innerText = `[ DOWNLOADING ${collectionName.toUpperCase()}... ]`;
            status.style.color = "var(--green)";
            try {
                const snapshot = await db.collection(collectionName).get();
                if(snapshot.empty) { status.innerText = "[ NO RECORDS FOUND ]"; status.style.color = "red"; return; }
                let csvContent = "\uFEFF";
                let rows = []; let headers = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    Object.keys(data).forEach(key => { if(!headers.includes(key)) headers.push(key); });
                });
                rows.push(headers.join(","));
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let row = headers.map(header => {
                        let val = data[header] || "";
                        if(val && val.seconds) val = new Date(val.toDate()).toLocaleString('en-GB');
                        return `"${val.toString().replace(/"/g, '""')}"`;
                    });
                    rows.push(row.join(","));
                });
                csvContent += rows.join("\n");
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `EX_${collectionName}_Archive.csv`;
                link.click();
                status.innerText = "[ DOWNLOAD COMPLETE ]";
            } catch(err) { status.innerText = "[ ERROR: SYSTEM BREACHED OR BLOCKED ]"; status.style.color = "red"; }
        }
    </script>
</body>
</html>
