<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フサム | The Mindset</title>
    
    <link rel="stylesheet" href="style.css">
    
    <style>
        .honeypot-field { position: absolute; left: -9999px; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <form aria-hidden="true">
        <input type="text" name="admin_fake_login" class="honeypot-field" autocomplete="off" tabindex="-1">
    </form>

    <div id="mindset-loader">
        <canvas id="brain-engine"></canvas>
        <div class="loader-ui">
            <div class="loader-subtitle">ENGINEERING THE HUMAN EXPERIENCE</div>
            <h1 class="loader-title">THE MINDSET</h1>
            <button id="hustle-btn">INITIALIZING...</button>
        </div>
    </div>

    <main id="main-site">
        <video id="hero-video" autoplay muted loop playsinline>
            <source src="ex1.mp4">
        </video>
        <div class="video-overlay"></div>

        <div class="hero-content">
            <h2 class="story-line line-1">This is not just a brand.</h2>
            <h2 class="story-line line-2">It's a state of mind.</h2>
            <h2 class="story-line line-3">Welcome to the hustle.</h2>
        </div>

        <div class="scroll-indicator">
            <span>DISCOVER MORE</span>
            <div class="arrow">↓</div>
        </div>
    </main>

    <script src="mindset-engine.js"></script>
    
    <script type="module">
        // استيراد المكتبات مباشرة عبر الإنترنت (CDN) لتجاوز أي مشاكل في المسارات
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import fpPromise from 'https://openfpcdn.io/fingerprintjs/v4';

        // مفاتيح الربط الخاصة بمشروع Nexus Security Logs
        const firebaseConfig = {
          apiKey: "AIzaSyAwjmFj10znbvlf6EUKS2RGuMy_FqZdtJY",
          authDomain: "nexus-security-logs.firebaseapp.com",
          projectId: "nexus-security-logs",
          storageBucket: "nexus-security-logs.firebasestorage.app",
          messagingSenderId: "907072029277",
          appId: "1:907072029277:web:a318d64ea971d08f6a83b4",
          measurementId: "G-09271PKTR6"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // الدالة الأمنية
        async function captureAndLogVisitor() {
          console.log("[Nexus Security] جاري استخراج البصمة من صفحة The Mindset...");
          try {
            const fp = await fpPromise.load();
            const result = await fp.get();
            const visitorHash = result.visitorId;
            
            console.log("🔑 تم التقاط البصمة:", visitorHash);

            const visitorData = {
              fingerprintId: visitorHash,
              userAgent: navigator.userAgent,
              screenResolution: `${window.screen.width}x${window.screen.height}`,
              language: navigator.language,
              timeOfVisit: serverTimestamp(),
              pageVisited: "The Mindset (Hero Page)", // لمعرفة من أي صفحة دخل
              suspiciousActivity: "None"
            };

            const docRef = await addDoc(collection(db, "SecurityLogs"), visitorData);
            console.log("🎯 تمت العملية بنجاح! تم الحفظ في قاعدة البيانات برقم:", docRef.id);
            
            // تنبيه مؤقت للتأكد من عمل الكود (يمكنك مسح هذا السطر لاحقاً)
            alert("نظام Nexus الأمني متصل ويعمل بنجاح على صفحة The Mindset!");

          } catch (error) {
            console.error("❌ حدث خطأ في النظام الأمني:", error);
          }
        }

        // تشغيل العملية فوراً
        captureAndLogVisitor();
    </script>

</body>
</html>
