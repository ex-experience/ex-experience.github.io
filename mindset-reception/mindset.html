<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フサム | The Mindset</title>
    <link rel="stylesheet" href="mindset-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <div id="mindset-loader">
        <canvas id="brain-engine"></canvas>
        <div class="loader-ui">
            <div class="loader-subtitle">ENGINEERING THE HUMAN EXPERIENCE</div>
            <h1 class="loader-title">THE MINDSET</h1>
            <button id="hustle-btn">INITIALIZING...</button>
        </div>
    </div>

    <main id="main-site">
        <video id="hero-video" autoplay muted loop playsinline>
            <source src="ex1.mp4">
        </video>
        <div class="video-overlay"></div>

        <div class="hero-content">
            <h2 class="story-line line-1">This is not just a brand.</h2>
            <h2 class="story-line line-2">It's a state of mind.</h2>
            <h2 class="story-line line-3">Welcome to the hustle.</h2>
        </div>

        <div class="scroll-indicator">
            <span>DISCOVER MORE</span>
            <div class="arrow">↓</div>
        </div>
    </main>

    <script src="mindset-engine.js"></script>
</body>
</html>
