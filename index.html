<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة سينمائية ثلاثية الأبعاد</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* إعدادات الألوان (يمكنك تغييرها لاحقاً لتطابق هويتك) */
        :root {
            --bg-color: #050505; /* أسود سينمائي */
            --text-primary: #ffffff;
            --brand-accent: #E31937; /* لون مميز، مثلاً أحمر */
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        /* مساحة العرض ثلاثية الأبعاد لتكون ثابتة في الخلفية */
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1; /* لجعلها خلف النصوص */
        }

        /* تنسيق أقسام السرد القصصي (Storytelling) */
        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 10%;
        }

        .title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.5rem;
            max-width: 600px;
            line-height: 1.6;
            color: #cccccc;
        }

        .brand-highlight {
            color: var(--brand-accent);
        }
    </style>
</head>
<body>

    <div id="webgl-container"></div>

    <section class="section">
        <h1 class="title">مرحباً بك في <span class="brand-highlight">المستقبل</span></h1>
        <p class="subtitle">قم بالتمرير للأسفل لتبدأ رحلتك السينمائية وترى كيف يتفاعل المجسم مع حركتك.</p>
    </section>

    <section class="section">
        <h2 class="title">تصميم <span class="brand-highlight">هندسي</span> دقيق</h2>
        <p class="subtitle">هنا سنضع نصوص البراند الخاصة بك، لتتناغم مع حركة المجسم في الخلفية تماماً كما في الأفلام.</p>
    </section>

    <section class="section">
        <h2 class="title">هويتك، <span class="brand-highlight">رؤيتك</span></h2>
        <p class="subtitle">هذا مجرد إطار مبدئي. سنقوم باستبدال هذا المجسم بمنتجاتك وصورك الخاصة.</p>
    </section>

    <script>
        // 1. إعداد مشهد Three.js
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true }); // alpha: true لجعل الخلفية شفافة
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // 2. إضافة إضاءة سينمائية
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // 3. إنشاء مجسم هندسي مؤقت (بديل لمنتجك حتى ترفعه)
        // استخدمت شكل هندسي معقد ليعطي طابعاً احترافياً
        const geometry = new THREE.TorusKnotGeometry(10, 3, 100, 16);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xE31937, // لون البراند
            wireframe: true  // عرض كخطوط هندسية
        });
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        camera.position.z = 30;

        // 4. ربط حركة المجسم بعجلة التمرير (Scroll) باستخدام GSAP
        gsap.registerPlugin(ScrollTrigger);

        // جعل المجسم يدور ويقترب كلما نزل المستخدم لأسفل
        gsap.to(mesh.rotation, {
            x: Math.PI * 2,
            y: Math.PI * 2,
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1 // لجعل الحركة ناعمة وتتبع الماوس
            }
        });

        gsap.to(camera.position, {
            z: 15, // تقريب الكاميرا
            scrollTrigger: {
                trigger: "body",
                start: "top top",
                end: "bottom bottom",
                scrub: 1
            }
        });

        // 5. دالة تحديث الشاشة المستمرة
        function animate() {
            requestAnimationFrame(animate);
            // دوران خفيف ومستمر حتى بدون تمرير
            mesh.rotation.y += 0.002;
            renderer.render(scene, camera);
        }
        animate();

        // 6. جعل المشهد يتجاوب مع تغيير حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
