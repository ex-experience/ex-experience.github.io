<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع السينمائي | الهندسة المطلقة</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <style>
        /* ========================================= */
        /* 1. إعدادات الهوية البصرية والتأثير النفسي */
        /* ========================================= */
        :root {
            --brand-color: #E31937; /* لون البراند (أحمر طاقة) */
            --bg-color: #030303; /* أسود عميق جداً */
            --text-color: #FFFFFF;
            --blueprint-line: rgba(0, 120, 255, 0.07); /* لون خطوط الهندسة */
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
            /* تفعيل الجذب المغناطيسي القوي */
            scroll-snap-type: y mandatory; 
        }

        /* ========================================= */
        /* 2. التأثيرات السينمائية والهندسية (الخلفيات) */
        /* ========================================= */
        
        /* شبكة المخططات الهندسية (Blueprint Grid) */
        .blueprint-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, var(--blueprint-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--blueprint-line) 1px, transparent 1px);
            z-index: -3;
        }

        /* تأثير حبيبات الفيلم السينمائي (Film Grain) */
        .film-grain {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Dissolve_Noise_Texture.png');
            opacity: 0.04;
            pointer-events: none;
            z-index: 10;
        }

        /* ========================================= */
        /* 3. هيكل الأقسام والنصوص */
        /* ========================================= */
        .story-section {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            scroll-snap-align: center; /* نقطة التوقف المغناطيسية */
        }

        /* تنسيق الصور بتأثير العمق */
        .cinematic-image {
            position: absolute;
            top: -10%; /* مساحة إضافية لحركة البارالاكس */
            left: 0;
            width: 100%;
            height: 120%; /* أكبر من الشاشة لتسمح بالحركة */
            object-fit: cover;
            z-index: -2;
            opacity: 0.4;
            filter: contrast(1.2) grayscale(0.2); /* تعديل لوني سينمائي */
        }

        /* طبقة تدرج لوني لدمج الصورة مع الخلفية */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, var(--bg-color) 90%);
            z-index: -1;
        }

        /* نصوص البراند - تصميم هندسي صارم */
        .brand-text {
            font-size: 5vw;
            font-weight: 900;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0px 10px 30px rgba(0,0,0,0.9);
            margin: 0;
            /* الإعدادات الأولية قبل التحريك */
            opacity: 0;
            transform: translateY(80px) scale(0.9);
            filter: blur(10px); 
        }

        .highlight {
            color: var(--brand-color);
            text-shadow: 0 0 20px rgba(227, 25, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="blueprint-bg"></div>
    <div class="film-grain"></div>

    <section class="story-section" id="section1">
        <img src="https://images.unsplash.com/photo-1617788138017-80ad40651399?q=80&w=2070&auto=format&fit=crop" class="cinematic-image" alt="مشهد سينمائي">
        <div class="overlay"></div>
        <h1 class="brand-text">صُمم ليكون <span class="highlight">المطلق</span></h1>
    </section>

    <section class="story-section" id="section2">
        <img src="https://images.unsplash.com/photo-1536147116438-ce2654222770?q=80&w=1995&auto=format&fit=crop" class="cinematic-image" alt="مشهد سينمائي آخر">
        <div class="overlay"></div>
        <h2 class="brand-text">هندسة تخاطب <span class="highlight">حواسك</span></h2>
    </section>

    <section class="story-section" id="section3">
        <div class="overlay"></div>
        <h2 class="brand-text">قوة <span style="color:#0078FF;">المخططات</span> الرقمية</h2>
    </section>

    <script>
        // تفعيل أداة التمرير
        gsap.registerPlugin(ScrollTrigger);

        // 1. حركة سينمائية معقدة للنصوص (ظهور، توضيح، وتكبير)
        gsap.utils.toArray('.brand-text').forEach(text => {
            gsap.to(text, {
                scrollTrigger: {
                    trigger: text,
                    start: "top 85%", // تبدأ الحركة عندما يصل العنصر لـ 85% من الشاشة
                    end: "center center",
                    scrub: 1 // ربط الحركة بسرعة تمرير الماوس (تأثير تفاعلي)
                },
                opacity: 1,
                y: 0,
                scale: 1,
                filter: "blur(0px)", // التحول من الضبابية إلى الوضوح التام
                ease: "power4.out"
            });
        });

        // 2. تأثير العمق البصري (Parallax) للصور الخلفية
        gsap.utils.toArray('.cinematic-image').forEach(image => {
            gsap.to(image, {
                scrollTrigger: {
                    trigger: image.parentElement,
                    start: "top bottom",
                    end: "bottom top",
                    scrub: true
                },
                y: "20%", // تحريك الصورة للأسفل ببطء أثناء التمرير
                ease: "none"
            });
        });
    </script>
</body>
</html>
