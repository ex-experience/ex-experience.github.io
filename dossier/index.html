<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>HUSSAM TAHIRI | EXECUTIVE DOSSIER</title>
    <style>
        :root { --bg: #121212; --text: #E0E0E0; --highlight: #FFFFFF; }
        body { background: var(--bg); color: var(--text); font-family: monospace; padding: 40px; }
        .container { max-width: 900px; margin: auto; }
        .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; }
        .brand-item { width: 100px; height: 60px; object-fit: contain; filter: grayscale(1) brightness(2); }
        .sys-log { color: #333; font-size: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>HUSSAM TAHIRI</h1>
    <div class="brand-grid">
        <img src="logos/ex.puma.png.webp" class="brand-item">
        <img src="logos/ex.nike.png.webp" class="brand-item">
        <img src="logos/ex.adidas.png.png" class="brand-item">
        <img src="logos/ex.umbro.png.jpg" class="brand-item">
        <img src="logos/ex.macron.png" class="brand-item">
        <img src="logos/ex.a6.png.webp" class="brand-item">
        <img src="logos/ex.soccerscene.png.jpeg" class="brand-item">
        <img src="logos/ex.alahli.png.png" class="brand-item">
        <img src="logos/ex.ittihad.png.jpg" class="brand-item">
        <img src="logos/ex.crkd.png.jpg" class="brand-item">
        <img src="logos/ex.caffienelab.png.jpg" class="brand-item">
        <img src="logos/ex.brew92.png.jpg" class="brand-item">
        <img src="logos/ex.sanremo.png.webp" class="brand-item">
        <img src="logos/ex.victoria.png.webp" class="brand-item">
        <img src="logos/ex.lamarzocco.png.png" class="brand-item">
        <img src="logos/ex.slayer.png.jpeg" class="brand-item">
        <img src="logos/ex.kvdw.png.png" class="brand-item">
        <img src="logos/ex.fitbit.png.webp" class="brand-item">
    </div>
    <div class="sys-log" id="logs"></div>
</div>
<script>
    const logDiv = document.getElementById('logs');
    for(let i=0; i<1000; i++) { logDiv.innerHTML += "SYSTEM_SECURE_NODE_" + i + "<br>"; }
</script>
</body>
</html>
