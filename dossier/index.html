    <style>
        :root { --bg: #121212; --text: #E0E0E0; --highlight: #FFFFFF; --accent: #333333; --border: #555; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px); background-size: 60px 60px; overflow-x: hidden; }

        @keyframes fadeIn { to { opacity: 1; } }
        .lang-switcher { position: fixed; top: 20px; left: 20px; font-family: 'Courier New', monospace; z-index: 100; background: rgba(18,18,18,0.8); padding: 5px 10px; border: 1px solid var(--accent); backdrop-filter: blur(5px); }

        .lang-switcher a:hover { color: var(--highlight); }
        .sys-header { font-family: 'Courier New', monospace; font-size: clamp(0.55rem, 1.5vw, 0.85rem); color: #888; border-bottom: 1px solid var(--accent); padding-bottom: 10px; margin-bottom: 40px; letter-spacing: 2px; text-transform: uppercase; }
        h1 { font-size: clamp(1.8rem, 6vw, 3.5rem); color: var(--highlight); margin: 0; font-weight: 300; letter-spacing: -1px;}
        h2 { font-size: clamp(0.65rem, 2.5vw, 1rem); color: #aaa; margin: 10px 0 40px 0; font-family: 'Courier New', monospace; letter-spacing: 1px;}
        .section { margin-bottom: 50px; border-left: 2px solid var(--accent); padding-left: 20px; }
        [dir="rtl"] .section { border-left: none; border-right: 2px solid var(--accent); padding-left: 0; padding-right: 20px; }
        .section-title { font-family: 'Courier New', monospace; font-size: clamp(0.8rem, 2.5vw, 1.2rem); color: var(--highlight); margin-bottom: 20px; letter-spacing: 1.5px; }
        .section-content p, .section-content li { font-size: clamp(0.9rem, 2vw, 1.05rem); line-height: 1.8; color: #ccc; }
        .section-content ul { list-style: none; padding: 0; margin: 0; }
        .section-content li { margin-bottom: 15px; position: relative; padding-left: 20px; }
        [dir="rtl"] .section-content li { padding-left: 0; padding-right: 20px; }
        .section-content li::before { content: '■'; position: absolute; left: 0; color: var(--border); font-size: 0.8rem; top: 5px; }
        [dir="rtl"] .section-content li::before { left: auto; right: 0; }
        
        /* BRAND GRID (LOGOS ONLY) */
        .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 20px; margin-top: 30px; align-items: center; justify-items: center; }
        .brand-item { width: 100%; height: 80px; display: flex; justify-content: center; align-items: center; padding: 10px; border: 1px solid transparent; transition: 0.4s; }
        .brand-item img { max-width: 100%; max-height: 100%; object-fit: contain; filter: grayscale(100%) opacity(0.5); transition: 0.4s; }
        .brand-item:hover { border-color: var(--accent); background: rgba(255,255,255,0.02); transform: translateY(-3px); }
        .brand-item:hover img { filter: grayscale(0%) opacity(1); }
        
        .service-card { border: 1px solid var(--accent); padding: 20px; margin-bottom: 15px; background: rgba(0,0,0,0.2); transition: 0.3s; }
        .service-card:hover { border-color: #666; }
        .service-card h4 { margin: 0 0 10px 0; color: #fff; font-family: 'Courier New', monospace; }
        .service-card p { margin: 0; font-size: 0.85rem; color: #aaa; line-height: 1.6;}
        .bridge-section { margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--accent); text-align: center; }
        .btn-sovereign { display: inline-block; padding: 15px 30px; border: 1px solid var(--border); color: var(--highlight); text-decoration: none; font-family: 'Courier New', monospace; transition: 0.3s; letter-spacing: 2px;}
