<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUSSAM TAHIRI | SOVEREIGN ARCHITECT</title>
    <link rel="preload" href="./logos/puma.webp" as="image">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --bg: #050505; --text: #f5f5f5; }
        html { scroll-behavior: auto; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .cinematic-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 30%), radial-gradient(circle at 80% 40%, rgba(255,255,255,0.03), transparent 35%); }
        .container { max-width: 700px; margin: 0 auto; padding: 120px 20px; }
        
        .display-xl { font-size: clamp(4rem, 10vw, 8rem); font-weight: 300; line-height: 0.86; letter-spacing: -0.06em; color: #fff; margin-bottom: 20px; text-transform: uppercase; }
        .char { display: inline-block; }
        
        .glass-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(24px); border-radius: 28px; padding: 40px; margin: 40px 0; }
        
        .brand-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 40px; align-items: center; margin-top: 60px; }
        .brand-item img { width: 100%; opacity: 0.4; filter: grayscale(1); transition: 0.6s cubic-bezier(.16,1,.3,1); }
        .brand-item:hover img { opacity: 1; filter: grayscale(0); transform: translateY(-5px); }

        .loader { position: fixed; inset: 0; background: #050505; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .loader-line { width: 200px; height: 1px; background: #fff; transform-origin: left; animation: load 2s ease-in-out; }
        @keyframes load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
</head>
<body>
    <div class="loader"><span class="loader-line"></span></div>
    <div class="cinematic-bg"></div>

    <div class="container">
        <section class="hero">
            <h1 id="name" class="display-xl" data-text="HUSSAM TAHIRI">HUSSAM TAHIRI</h1>
            <p class="caption">Architecting Human-Centric Luxury Systems</p>
        </section>

        <section class="glass-panel">
            <h3>[ PHILOSOPHY ]</h3>
            <p class="body-lg">Specialized in cinematic digital systems and strategic brand ecosystems. Deconstructing consumption rituals to engineer human-centric luxury.</p>
        </section>

        <section>
            <h3>[ SELECTED ECOSYSTEMS ]</h3>
            <div class="brand-grid">
                <div class="brand-item"><img src="./logos/puma.webp" alt="Puma"></div>
                <div class="brand-item"><img src="./logos/nike.webp" alt="Nike"></div>
                <div class="brand-item"><img src="./logos/adidas.png" alt="Adidas"></div>
                <div class="brand-item"><img src="./logos/umbro.jpg" alt="Umbro"></div>
                <div class="brand-item"><img src="./logos/macron.png" alt="Macron"></div>
            </div>
        </section>
    </div>

    <script>
        // Smooth Scroll (Lenis)
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        // Text Reveal (SplitType + GSAP)
        const name = new SplitType('#name');
        gsap.from('.char', { opacity: 0, y: 80, rotateX: 90, stagger: 0.05, duration: 1.5, ease: "power4.out" });

        // Loader
        window.addEventListener('load', () => { gsap.to('.loader', { opacity: 0, duration: 1, delay: 2, onComplete: () => document.querySelector('.loader').remove() }); });
    </script>
</body>
</html>
