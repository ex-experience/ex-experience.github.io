<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUSSAM TAHIRI | SOVEREIGN ARCHITECT</title>
    <meta property="og:title" content="HUSSAM TAHIRI">
    <meta property="og:description" content="Architecting Human-Centric Luxury Systems">
    
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { 
            --bg-primary: #050505; --bg-secondary: #0d0d0d;
            --text-primary: #f5f5f5; --text-secondary: #a0a0a0;
            --highlight: #ffffff; --accent: #222;
        }
        html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Inter', sans-serif; padding: 80px 20px; display: flex; justify-content: center; min-height: 100vh; position: relative; }
        
        /* Atmospheric Layers */
        body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.07), transparent 60%), radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03), transparent 40%); z-index: -2; pointer-events: none; }
        body::after { content: ""; position: fixed; inset: 0; background-image: url('https://www.transparenttextures.com/patterns/asfalt-light.png'); opacity: 0.04; pointer-events: none; z-index: -1; }
        
        .container { max-width: 700px; width: 100%; animation: fadeUp 1.5s cubic-bezier(.16,1,.3,1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        .hero { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; position: relative; }
        .hero::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 180px; background: linear-gradient(to top, #050505, transparent); pointer-events: none; }
        
        .display-xl { font-size: clamp(4rem, 10vw, 8rem); font-weight: 300; line-height: 0.85; letter-spacing: -0.08em; color: var(--highlight); margin-bottom: 20px; background: linear-gradient(180deg, #fff 0%, #cfcfcf 45%, #707070 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; position: relative; }
        .display-xl::after { content: attr(data-text); position: absolute; left: 0; top: 0; z-index: -1; filter: blur(40px); opacity: 0.08; color: #fff; }
        
        .body-lg { font-size: 1.2rem; line-height: 1.9; color: var(--text-secondary); margin-bottom: 40px; }
        .caption { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; color: #666; }
        
        .section-line { width: 100%; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent); margin: 80px 0; }
        
        /* Reveal */
        .reveal { opacity: 0; transform: translateY(40px); filter: blur(10px); transition: transform 1s cubic-bezier(.16,1,.3,1), filter 1s cubic-bezier(.16,1,.3,1), opacity 1s cubic-bezier(.16,1,.3,1); }
        .reveal.active { opacity: 1; transform: translateY(0); filter: blur(0); }
        
        /* Grid */
        .brand-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 60px 40px; align-items: center; margin-top: 70px; }
        .brand-item img { width: 100%; height: 45px; object-fit: contain; opacity: 0.45; filter: grayscale(1) brightness(0.9); transition: transform 1s cubic-bezier(.16,1,.3,1), opacity 1s cubic-bezier(.16,1,.3,1), filter 1s cubic-bezier(.16,1,.3,1); }
        .brand-item:hover img { opacity: 1; filter: grayscale(0) brightness(1.2); transform: translateY(-6px) scale(1.04); }
        
        /* Lang & Cursor */
        .lang-switcher { position: fixed; top: 25px; left: 25px; display: flex; gap: 10px; z-index: 1000; }
        .lang-switcher button { background: none; border: none; color: #666; cursor: pointer; font-size: .75rem; transition: .3s; }
        .lang-switcher button:hover { color: #fff; }
        .cursor-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.035), transparent 70%); pointer-events: none; transform: translate(-50%,-50%); z-index: -1; }
        
        @media(max-width:768px){ .display-xl { font-size: 3rem; } .brand-grid { grid-template-columns: repeat(2, 1fr); gap: 35px; } }
        body[dir="rtl"] { font-family: "Tajawal", sans-serif; text-align: right; }
    </style>
</head>
<body>
<div class="cursor-glow"></div>
<div class="loader" style="position:fixed; inset:0; background:#050505; z-index:9999; transition:opacity 1s ease;"></div>
<div class="lang-switcher">
    <button onclick="setLang('en')">EN</button><button onclick="setLang('ar')">AR</button>
</div>

<div class="container">
    <section class="hero reveal">
        <h1 id="name" class="display-xl" data-text="HUSSAM TAHIRI">HUSSAM TAHIRI</h1>
        <h2 id="role" class="caption">Architecting Human-Centric Luxury Systems</h2>
    </section>

    <section class="reveal">
        <h3 data-en="[ PHILOSOPHY ]" data-ar="[ الفلسفة ]"></h3>
        <p class="body-lg" data-en="Specialized in cinematic digital systems, AI-assisted workflows, and strategic brand ecosystems. Focused on deconstructing traditional consumption rituals to engineer human-centric luxury environments." data-ar="متخصص في الأنظمة الرقمية السينمائية، سير العمل المدعوم بالذكاء الاصطناعي، والنظم البيئية للعلامات التجارية الاستراتيجية. أركز على تفكيك طقوس الاستهلاك التقليدية لهندسة بيئات فاخرة تتمحور حول الإنسان."></p>
    </section>

    <div class="section-line"></div>

    <section class="reveal">
        <h3 data-en="[ SELECTED ECOSYSTEMS ]" data-ar="[ الأنظمة المختارة ]"></h3>
        <div class="brand-grid">
            <div class="brand-item"><img src="./logos/puma.webp" alt="Puma" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
            <div class="brand-item"><img src="./logos/nike.webp" alt="Nike" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
            <div class="brand-item"><img src="./logos/adidas.png" alt="Adidas" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
            <div class="brand-item"><img src="./logos/umbro.jpg" alt="Umbro" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
            <div class="brand-item"><img src="./logos/macron.png" alt="Macron" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
            <div class="brand-item"><img src="./logos/asics.webp" alt="ASICS" loading="lazy" decoding="async" onerror="this.style.display='none'"></div>
        </div>
    </div>
</div>

<script>
    // Reveal Observer
    const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); }); }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    
    // Mouse Glow
    const glow = document.querySelector('.cursor-glow');
    window.addEventListener('mousemove', e => { glow.style.left = e.clientX + 'px'; glow.style.top = e.clientY + 'px'; });
    
    // Loader
    window.addEventListener('load', () => { const l = document.querySelector('.loader'); l.style.opacity = '0'; setTimeout(() => l.remove(), 1000); });
    
    // Lang
    function setLang(lang) { document.body.dir = lang === "ar" ? "rtl" : "ltr"; document.querySelectorAll("[data-en]").forEach(el => { el.innerHTML = lang === "ar" ? el.dataset.ar : el.dataset.en; }); }
</script>
</body>
</html>
