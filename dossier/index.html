<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUSSAM TAHIRI | SOVEREIGN ARCHITECT</title>
    <meta name="description" content="Architecting Human-Centric Luxury Systems">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        :root { --bg: #050505; --text: #f5f5f5; --highlight: #ffffff; }
        html { scroll-behavior: auto; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 120px 20px; min-height: 100vh; position: relative; overflow-x: hidden; }
        
        .cinematic-bg { position: fixed; inset: 0; z-index: -3; background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 30%), radial-gradient(circle at 80% 40%, rgba(255,255,255,0.03), transparent 35%); will-change: transform; }
        .scroll-line { position: fixed; top: 0; left: 0; width: 0%; height: 1px; background: #fff; z-index: 9999; }
        
        .container { max-width: 700px; margin: 0 auto; transform: translateZ(0); }
        .hero { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; position: relative; }
        
        /* Typography System */
        .display-xl { font-size: clamp(4rem, 10vw, 8rem); font-weight: 300; line-height: 0.86; letter-spacing: -0.06em; color: var(--highlight); margin-bottom: 20px; background: linear-gradient(180deg, #fff 0%, #cfcfcf 45%, #707070 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        .body-lg { font-size: 1.2rem; line-height: 1.9; color: #b0b0b0; margin-bottom: 40px; }
        .caption { font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 4px; opacity: 0.55; }
        
        /* Glass & Grid */
        .glass-panel { position: relative; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(24px); border-radius: 28px; padding: 50px; margin: 60px 0; overflow: hidden; }
        .glass-panel::after { content: ""; position: absolute; inset: -200%; background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,.06), transparent 80%); transform: rotate(25deg); animation: glassMove 8s linear infinite; }
        @keyframes glassMove { from { transform: translateX(-40%) rotate(25deg); } to { transform: translateX(40%) rotate(25deg); } }
        
        .brand-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 40px; margin-top: 60px; }
        .brand-item { width: 100%; height: 45px; display: flex; align-items: center; justify-content: center; transition: transform 0.3s ease; }
        .brand-item img { width: 100%; max-width: 100px; opacity: 0.5; filter: grayscale(1) brightness(0.8); transition: 0.8s cubic-bezier(.16,1,.3,1); }
        .brand-item:hover img { opacity: 1; filter: grayscale(0) brightness(1.2); transform: translateY(-8px) scale(1.05); }
        
        .reveal { opacity: 0; transform: translateY(40px); }
    </style>
</head>
<body>
    <div class="cinematic-bg"></div>
    <div class="scroll-line"></div>

    <main class="container">
        <section class="hero">
            <h1 id="name" class="display-xl" data-text="HUSSAM TAHIRI">HUSSAM TAHIRI</h1>
            <p id="role" class="caption">Architecting Human-Centric Luxury Systems</p>
        </section>

        <section class="reveal glass-panel">
            <h3>[ OPERATING PHILOSOPHY ]</h3>
            <p class="body-lg">Specialized in cinematic digital systems and strategic brand ecosystems. Focused on deconstructing traditional consumption rituals to engineer human-centric luxury environments.</p>
        </section>

        <section class="reveal">
            <h3>[ SELECTED ECOSYSTEMS ]</h3>
            <div class="brand-grid">
                <div class="brand-item"><img src="./logos/puma.webp" alt="Puma"></div>
                <div class="brand-item"><img src="./logos/nike.webp" alt="Nike"></div>
                <div class="brand-item"><img src="./logos/adidas.png" alt="Adidas"></div>
                <div class="brand-item"><img src="./logos/umbro.jpg" alt="Umbro"></div>
                <div class="brand-item"><img src="./logos/macron.png" alt="Macron"></div>
                <div class="brand-item"><img src="./logos/asics.webp" alt="ASICS"></div>
            </div>
        </section>
    </main>

    <script>
        // Smooth Scroll
        const lenis = new Lenis();
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        // Cinematic Typography
        gsap.registerPlugin(ScrollTrigger);
        const split = new SplitType('#name', { types: 'chars' });
        const tl = gsap.timeline();
        tl.from(split.chars, { y: 180, opacity: 0, rotateX: 90, stagger: 0.04, duration: 1.6, ease: "power4.out" })
          .from('.caption', { opacity: 0, y: 30, duration: 1 }, "-=1.2");

        // Reveal System
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => { if(entry.isIntersecting) { entry.target.classList.add('active'); observer.unobserve(entry.target); } });
        }, { threshold: 0.15 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        // Magnetic Grid
        document.querySelectorAll('.brand-item').forEach(item => {
            item.addEventListener('mousemove', e => {
                const rect = item.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                gsap.to(item, { x: x * 0.2, y: y * 0.2, scale: 1.05, duration: 0.5 });
            });
            item.addEventListener('mouseleave', () => gsap.to(item, { x: 0, y: 0, scale: 1, duration: 0.5 }));
        });
    </script>
</body>
</html>
