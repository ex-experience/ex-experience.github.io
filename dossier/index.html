<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUSSAM TAHIRI | EXECUTIVE DOSSIER</title>
    <style>
        :root { --bg: #121212; --text: #E0E0E0; --highlight: #FFFFFF; --accent: #333; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { max-width: 900px; width: 100%; }
        .sys-header { border-bottom: 1px solid var(--accent); padding-bottom: 10px; margin-bottom: 40px; font-size: 0.8rem; color: #888; text-transform: uppercase; }
        h1 { font-size: 3rem; color: var(--highlight); margin: 0; }
        h2 { font-size: 1rem; color: #aaa; margin: 10px 0 30px 0; }
        .section { margin-bottom: 40px; border-left: 2px solid var(--accent); padding-left: 20px; }
        .section-title { font-size: 1.1rem; color: var(--highlight); margin-bottom: 15px; text-transform: uppercase; }
        .service-card { border: 1px solid var(--accent); padding: 20px; margin-bottom: 15px; background: rgba(255,255,255,0.02); }
        .service-card h4 { margin: 0 0 10px 0; color: #fff; }
        .service-card p { font-size: 0.9rem; color: #aaa; margin: 0; }
        .brand-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 20px; margin-top: 30px; }
        .brand-item { width: 100px; height: 60px; display: flex; align-items: center; justify-content: center; border: 1px solid #222; }
        .brand-item img { max-width: 80%; max-height: 40px; filter: grayscale(1) brightness(2); transition: 0.3s; }
        .brand-item:hover img { filter: grayscale(0) brightness(1); }
        .lang-switcher { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.5); padding: 5px; border: 1px solid #333; }
        .lang-switcher a { color: #888; text-decoration: none; margin: 0 5px; cursor: pointer; }
    </style>
</head>
<body>
<div class="lang-switcher">
    <a onclick="setLang('en')">EN</a> | <a onclick="setLang('ar')">AR</a> | <a onclick="setLang('fr')">FR</a> | <a onclick="setLang('jp')">JP</a>
</div>
<div class="container">
    <div class="sys-header">[ SOVEREIGN DOSSIER - SYSTEM ONLINE ]</div>
    <h1 id="name">HUSSAM TAHIRI</h1>
    <h2 id="role">[ EXECUTIVE ARCHITECT & SENSORY STRATEGIST ]</h2>

    <div class="section">
        <div class="section-title" id="p1-title"></div>
        <p id="p1-desc"></p>
    </div>

    <div class="section">
        <div class="section-title" id="services-title"></div>
        <div id="services-list"></div>
    </div>

    <div class="section">
        <div class="section-title" id="brands-title"></div>
        <div class="brand-grid">
            <div class="brand-item"><img src="logos/ex.puma.png.webp" alt="Puma"></div>
            <div class="brand-item"><img src="logos/ex.nike.png.webp" alt="Nike"></div>
            <div class="brand-item"><img src="logos/ex.adidas.png.png" alt="Adidas"></div>
            <div class="brand-item"><img src="logos/ex.umbro.png.jpg" alt="Umbro"></div>
            <div class="brand-item"><img src="logos/ex.macron.png" alt="Macron"></div>
            <div class="brand-item"><img src="logos/ex.a6.png.webp" alt="ASICS"></div>
            <div class="brand-item"><img src="logos/ex.soccerscene.png.jpeg" alt="Soccer Scene"></div>
            <div class="brand-item"><img src="logos/ex.alahli.png.png" alt="Alahli"></div>
            <div class="brand-item"><img src="logos/ex.ittihad.png.jpg" alt="Ittihad"></div>
            <div class="brand-item"><img src="logos/ex.crkd.png.jpg" alt="Crkd.guru"></div>
            <div class="brand-item"><img src="logos/ex.caffienelab.png.jpg" alt="Caffeine Lab"></div>
            <div class="brand-item"><img src="logos/ex.brew92.png.jpg" alt="Brew92"></div>
            <div class="brand-item"><img src="logos/ex.sanremo.png.webp" alt="Sanremo"></div>
            <div class="brand-item"><img src="logos/ex.victoria.png.webp" alt="Victoria Arduino"></div>
            <div class="brand-item"><img src="logos/ex.lamarzocco.png.png" alt="La Marzocco"></div>
            <div class="brand-item"><img src="logos/ex.slayer.png.jpeg" alt="Slayer"></div>
            <div class="brand-item"><img src="logos/ex.kvdw.png.png" alt="Kees Van Der Westen"></div>
            <div class="brand-item"><img src="logos/ex.fitbit.webp.webp" alt="Fitbit"></div>
        </div>
    </div>
</div>
<script>
    const data = {
        en: { name: "HUSSAM TAHIRI", role: "[ EXECUTIVE ARCHITECT ]", p1t: "THE NEGATIVE AUDIT", p1d: "Deconstructing systems to build integrated ecosystems. [cite: 55]", svt: "ENTERPRISE SOLUTIONS", svl: "<div class='service-card'><h4>Brand Genesis</h4><p>Strategic positioning & Sensory Identity. [cite: 6, 11]</p></div><div class='service-card'><h4>Infrastructure</h4><p>Zero-Trust Security & Cloud Engineering. [cite: 69]</p></div>", brt: "STRATEGIC PARTNERSHIPS", dir: "ltr" },
        ar: { name: "حسام طاهري", role: "[ المهندس التنفيذي والمستشار الحسي ]", p1t: "التدقيق العكسي", p1d: "تفكيك الأنظمة لبناء بيئات رقمية تعيد تعريف الفخامة البسيطة. [cite: 55]", svt: "خدمات المؤسسات", svl: "<div class='service-card'><h4>هندسة الحمض النووي للعلامة</h4><p>التموضع الاستراتيجي والهوية الحسية. [cite: 6, 11]</p></div><div class='service-card'><h4>البنية التحتية</h4><p>بنية الثقة المعدومة وهندسة السحابة. [cite: 69]</p></div>", brt: "الشراكات الاستراتيجية", dir: "rtl" },
        fr: { name: "HUSSAM TAHIRI", role: "[ ARCHITECTE ]", p1t: "AUDIT NÉGATIF", p1d: "Déconstruction des systèmes. [cite: 55]", svt: "SERVICES D'ENTREPRISE", svl: "<div class='service-card'><h4>Architecture ADN</h4><p>Positionnement stratégique. [cite: 6, 11]</p></div>", brt: "PARTENARIATS", dir: "ltr" },
        jp: { name: "フサム・タヒリ", role: "[ アーキテクト ]", p1t: "ネガティブ・オーディット", p1d: "システムの解体。 [cite: 55]", svt: "エンタープライズサービス", svl: "<div class='service-card'><h4>ブランドDNA</h4><p>戦略的ポジショニング。 [cite: 6, 11]</p></div>", brt: "戦略的パートナーシップ", dir: "ltr" }
    };
    function setLang(l) {
        const d = data[l];
        document.body.dir = d.dir;
        document.getElementById('name').innerText = d.name;
        document.getElementById('role').innerText = d.role;
        document.getElementById('p1-title').innerText = d.p1t;
        document.getElementById('p1-desc').innerText = d.p1d;
        document.getElementById('services-title').innerText = d.svt;
        document.getElementById('brands-title').innerText = d.brt;
        document.getElementById('services-list').innerHTML = d.svl;
    }
    window.onload = () => setLang('en');
</script>
</body>
</html>
